<style>
  .nav { display: flex; justify-content: flex-end; align-items: center; gap: 12px; font-size: 14px; color: #555; margin-bottom: 8px; }
  .nav a { color: #555; text-decoration: none; }
  .nav form { display: inline; margin: 0; }
  .nav button { border: 0; background: none; color: #555; cursor: pointer; font-size: 14px; padding: 0; }
  .flash { background: #fff7e0; border: 1px solid #f0d890; color: #7a5b00; padding: 10px 12px; border-radius: 8px; margin: 8px 0; font-size: 14px; }
</style>
<div class="nav">
  {% if current_user %}
    <span>{{ current_user }}님</span>
    <form action="/logout" method="post"><button type="submit">로그아웃</button></form>
  {% else %}
    <a href="/login">로그인</a>
    <a href="/register">회원가입</a>
  {% endif %}
</div>
{% with messages = get_flashed_messages() %}
  {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
{% endwith %}
