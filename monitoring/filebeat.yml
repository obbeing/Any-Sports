# Nginx JSON 접속 로그와 앱 JSON 이벤트 로그를 읽어 Elasticsearch로 보낸다.
filebeat.inputs:
  - type: filestream
    id: nginx-access
    paths:
      - /logs/nginx/access.json.log
    parsers:
      - ndjson:
          target: "nginx"
          add_error_key: true
    fields:
      log_type: nginx_access
    fields_under_root: true
    processors:
      # 로그의 time 값을 @timestamp로 사용
      - timestamp:
          field: nginx.time
          layouts:
            - '2006-01-02T15:04:05Z07:00'
          test:
            - '2026-11-14T00:07:42+00:00'
          ignore_failure: true
      # 퍼센트 인코딩된 검색어를 한글로 디코딩하고, 접속자 IP(X-Forwarded-For 첫 값)를 뽑는다
      - script:
          lang: javascript
          id: decode_keyword
          source: |
            function process(event) {
              var q = event.Get("nginx.search_q");
              if (q) {
                try {
                  event.Put("nginx.search_keyword", decodeURIComponent(q.replace(/\+/g, " ")));
                } catch (e) {
                  event.Put("nginx.search_keyword", q);
                }
              }
              var xff = event.Get("nginx.xff");
              var ip = xff ? String(xff).split(",")[0].replace(/^\s+|\s+$/g, "") : event.Get("nginx.remote_addr");
              event.Put("nginx.client_ip", ip);
            }

  - type: filestream
    id: app-events
    paths:
      - /logs/app/app.json.log
    parsers:
      - ndjson:
          target: "app"
          add_error_key: true
    fields:
      log_type: app_event
    fields_under_root: true
    processors:
      - timestamp:
          field: app.ts
          layouts:
            - '2006-01-02T15:04:05Z07:00'
          test:
            - '2026-11-14T00:07:42.737+00:00'
          ignore_failure: true

  - type: filestream
    id: detector-events
    paths:
      - /logs/detector/detector.json.log
    parsers:
      - ndjson:
          target: "detector"
          add_error_key: true
    fields:
      log_type: detector_event
    fields_under_root: true
    processors:
      - timestamp:
          field: detector.ts
          layouts:
            - '2006-01-02T15:04:05Z07:00'
          test:
            - '2026-11-14T00:07:42+00:00'
          ignore_failure: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  indices:
    - index: "any-sports-nginx-%{+yyyy.MM.dd}"
      when.equals:
        log_type: nginx_access
    - index: "any-sports-app-%{+yyyy.MM.dd}"
      when.equals:
        log_type: app_event
    - index: "any-sports-detector-%{+yyyy.MM.dd}"
      when.equals:
        log_type: detector_event

# 인덱스 이름을 직접 정하므로 ILM과 기본 템플릿은 사용하지 않는다 (동적 매핑 사용)
setup.ilm.enabled: false
setup.template.enabled: false
setup.template.name: "any-sports"
setup.template.pattern: "any-sports-*"

logging.level: info
