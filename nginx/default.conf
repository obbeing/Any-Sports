# 분석용 JSON 접속 로그 (Filebeat가 그대로 읽는다)
log_format json_log escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","xff":"$http_x_forwarded_for",'
  '"method":"$request_method","request_uri":"$request_uri","args":"$args","search_q":"$arg_q",'
  '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
  '"referer":"$http_referer","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;

    # 사람이 읽는 로그(docker logs)와 분석용 JSON 로그를 둘 다 남긴다
    access_log /dev/stdout main;
    access_log /var/log/nginx/access.json.log json_log;

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
