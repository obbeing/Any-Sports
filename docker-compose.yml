services:
  db:
    image: mariadb:11
    container_name: sports-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: sports
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./web
    container_name: sports-web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: sports
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - app_logs:/var/log/app
      - shared:/shared:ro          # 탐지기가 갱신하는 차단 목록 (읽기 전용)
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    container_name: sports-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web

  # ---------- 로그 분석 (ELK) ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: sports-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: sports-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - ./monitoring:/monitoring:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    container_name: sports-filebeat
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./monitoring/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - nginx_logs:/logs/nginx:ro
      - app_logs:/logs/app:ro
      - detector_logs:/logs/detector:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ---------- 탐지 / 자동 차단 ----------
  detector:
    image: python:3.12-slim
    container_name: sports-detector
    restart: unless-stopped
    environment:
      ES_URL: http://elasticsearch:9200
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./scripts:/scripts:ro
      - shared:/shared
      - detector_logs:/logs/detector
    command: ["python", "/scripts/detector.py", "--interval", "10"]
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ---------- 인프라 지표 관제 (Zabbix + Grafana) ----------
  # 평소에는 뜨지 않고 `docker compose --profile monitoring up -d` 로만 실행된다
  zabbix-db:
    image: postgres:16-alpine
    container_name: sports-zbx-db
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZBX_DB_PASSWORD}
      POSTGRES_DB: zabbix
    volumes:
      - zbx_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 5s
      timeout: 5s
      retries: 20

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: sports-zbx-server
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZBX_DB_PASSWORD}
      POSTGRES_DB: zabbix
    depends_on:
      zabbix-db:
        condition: service_healthy

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: sports-zbx-web
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZBX_DB_PASSWORD}
      POSTGRES_DB: zabbix
      PHP_TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - zabbix-server

  # 감시 대상(= Docker가 돌아가는 리눅스 VM)에 설치되는 에이전트
  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: sports-zbx-agent
    profiles: ["monitoring"]
    restart: unless-stopped
    privileged: true
    pid: host
    environment:
      ZBX_HOSTNAME: sports-docker-host
      ZBX_SERVER_HOST: zabbix-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # 컨테이너 상태 수집용 (실습 환경 한정)
    depends_on:
      - zabbix-server

  grafana:
    image: grafana/grafana:11.6.0
    container_name: sports-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - zabbix-web

  # 테스트 트래픽 생성 도구: docker compose up 으로는 뜨지 않고 run 으로만 실행된다
  traffic:
    image: python:3.12-slim
    profiles: ["tools"]
    environment:
      BASE_URL: http://nginx
    volumes:
      - ./scripts:/scripts:ro
      - ./docs:/docs
    depends_on:
      - nginx
    entrypoint: ["python", "/scripts/traffic.py"]

volumes:
  db_data:
  nginx_logs:
  app_logs:
  es_data:
  filebeat_data:
  shared:
  detector_logs:
  zbx_db:
  grafana_data:
